# JNDI settings for the remote client. Uncomment the block for your server
# (or pass the same keys as -D system properties).

# --- GlassFish 3.x (needs gf-client.jar from glassfish/lib on the classpath) ---
#java.naming.factory.initial=com.sun.enterprise.naming.SerialInitContextFactory
#org.omg.CORBA.ORBInitialHost=localhost
#org.omg.CORBA.ORBInitialPort=3700
# Home JNDI name (default used by the client):
#   java:global/jee6-ejb-examples/jee6-ejb-examples-ejb/ShoppingCartEJB!com.example.ejb.cart.ShoppingCartHome

# --- JBoss AS 7 / EAP 6 (needs bin/client/jboss-client.jar on the classpath) ---
#java.naming.factory.url.pkgs=org.jboss.ejb.client.naming
# Connection details go in jboss-ejb-client.properties. Home JNDI names:
#   -Dcart.jndi=ejb:jee6-ejb-examples/jee6-ejb-examples-ejb//ShoppingCartEJB!com.example.ejb.cart.ShoppingCartHome?stateful
#   -Dconverter.jndi=ejb:jee6-ejb-examples/jee6-ejb-examples-ejb//CurrencyConverterEJB!com.example.ejb.converter.CurrencyConverterHome
