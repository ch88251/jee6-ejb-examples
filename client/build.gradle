// Standalone (Java SE) clients that call the web application's services
// through Redisson RemoteService. They need only Redis, not the servlet container.
plugins {
    id 'application'
}

apply from: rootProject.file('gradle/unit-tests.gradle')

dependencies {
    implementation project(':core')     // the service interfaces + Redisson
    runtimeOnly "org.slf4j:slf4j-simple:${rootProject.slf4jVersion}"

    testImplementation testFixtures(project(':core'))   // RedisTestServer
}

application {
    // ./gradlew :client:installDist -> client/build/install/client/bin/client
    mainClass = 'com.example.client.ShoppingCartRemoteClient'
}

// Settings shared by the run tasks:
//   -PredisAddress=redis://host:6379   Redis the web application uses (default redis://localhost:6379)
def configureRemoteClient = { JavaExec task, String clientMainClass ->
    task.group = 'application'
    task.classpath = sourceSets.main.runtimeClasspath
    task.mainClass = clientMainClass
    if (project.hasProperty('redisAddress')) {
        task.systemProperty 'redis.address', project.property('redisAddress')
    }
}

// Cart client, e.g. ./gradlew runClient -PcustomerName=Bob
tasks.register('runClient', JavaExec) {
    description = 'Runs the shopping cart remote client.'
    configureRemoteClient(it, 'com.example.client.ShoppingCartRemoteClient')
    args project.findProperty('customerName') ?: 'Alice'
}

// Converter client, e.g. ./gradlew runConverterClient -Pconvert="250 GBP JPY"
tasks.register('runConverterClient', JavaExec) {
    description = 'Runs the currency converter remote client.'
    configureRemoteClient(it, 'com.example.client.CurrencyConverterRemoteClient')
    if (project.hasProperty('convert')) {
        args project.property('convert').toString().trim().split(/\s+/)
    }
}
