plugins {
    id 'ear'
}

dependencies {
    deploy project(':ejb')
    deploy project(path: ':web', configuration: 'warFile')
}

ear {
    archiveFileName = 'jee6-ejb-examples.ear'
    deploymentDescriptor {
        version = '6'
        applicationName = 'jee6-ejb-examples'   // first part of java:global/... names
        displayName = 'Java EE 6 EJB 2.x Examples'
        module 'jee6-ejb-examples-ejb.jar', 'ejb'
        webModule 'jee6-ejb-examples-web.war', '/jee6-ejb-examples'
    }
}
