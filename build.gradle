// Multi-module build: POJO services (core), a WAR (web) and standalone clients.
// Redis, through the Redisson client, holds the data, the configuration and the
// price change queue, and carries the remote calls.
//   ./gradlew buildWar   -> web/build/libs/jee6-ejb-examples.war   (deploy this)
//   ./gradlew coverage   -> build/reports/jacoco/testCodeCoverageReport/html/index.html
//   ./gradlew appUp      -> Redis + Tomcat in Docker, with the WAR deployed

plugins {
    id 'base'
    // Combines the modules' JaCoCo data into one report (see 'coverage' below).
    id 'jacoco-report-aggregation'
}

allprojects {
    group = 'com.example'
    version = '1.0.0-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

ext {
    redissonVersion = '4.8.0'
    jacksonVersion = '2.22.1'          // the Jackson 2 version Redisson 4.8.0 is built against
    slf4jVersion = '2.0.17'
    testcontainersVersion = '2.0.5'

    // Minimum line coverage per module, enforced by ./gradlew check / build
    // (see gradle/unit-tests.gradle).
    defaultMinLineCoverage = 0.85   // override: -PminLineCoverage=0.9
}

subprojects {
    plugins.withType(JavaPlugin).configureEach {
        tasks.withType(JavaCompile).configureEach {
            // Tomcat 9 and Redisson run on Java 8+, but there is no longer an
            // old application server to target, so use a current LTS.
            options.release = 17
            options.encoding = 'UTF-8'
        }
    }
}

tasks.register('buildWar') {
    group = 'build'
    description = 'Compiles the sources and assembles the deployable WAR file.'
    dependsOn ':web:war'
    def warFile = project(':web').tasks.named('war').flatMap { it.archiveFile }
    doLast {
        println "WAR file built: ${warFile.get().asFile}"
    }
}

// ---- Combined code coverage for all modules with unit tests ----
dependencies {
    jacocoAggregation project(':core')
    jacocoAggregation project(':web')
    jacocoAggregation project(':client')
}

reporting {
    reports {
        testCodeCoverageReport(JacocoCoverageReport) {
            testSuiteName = 'test'
        }
    }
}

tasks.register('coverage') {
    group = 'verification'
    description = 'Runs all unit tests and writes the combined JaCoCo coverage report.'
    dependsOn tasks.named('testCodeCoverageReport')
    def report = tasks.named('testCodeCoverageReport', JacocoReport).flatMap { it.reports.html.outputLocation }
    doLast {
        println "Coverage report: ${report.get().file('index.html').asFile}"
    }
}

// ---- Redis + Tomcat in Docker (see docker/ and the README) ----
def appTask = { String name, String command, String text, List deps ->
    tasks.register(name, Exec) {
        group = 'docker'
        description = text
        dependsOn deps
        workingDir rootDir
        commandLine 'sh', 'docker/app.sh', command
    }
}
appTask('appUp', 'up', 'Builds the WAR, starts Redis and Tomcat in Docker and deploys the app.', ['buildWar'])
appTask('appDeploy', 'deploy', 'Rebuilds the WAR and redeploys it to the running Tomcat container.', ['buildWar'])
appTask('appClients', 'clients', 'Runs both remote clients against the running containers.', [':client:installDist'])
appTask('appLogs', 'logs', 'Follows the Tomcat log.', [])
appTask('appDown', 'down', 'Stops and removes the containers (and the Redis data).', [])
