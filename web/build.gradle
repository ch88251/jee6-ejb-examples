plugins {
    id 'war'
}

apply from: rootProject.file('gradle/unit-tests.gradle')

dependencies {
    // Servlet 4.0 (javax.*), supplied by Tomcat 9 at runtime.
    providedCompile 'javax.servlet:javax.servlet-api:4.0.1'
    // The services and Redisson are packaged in WEB-INF/lib.
    implementation project(':core')
    runtimeOnly "org.slf4j:slf4j-simple:${rootProject.slf4jVersion}"   // Redisson logs through SLF4J

    testImplementation testFixtures(project(':core'))   // RedisTestServer
}

war {
    // Tomcat deploys jee6-ejb-examples.war at /jee6-ejb-examples
    archiveFileName = 'jee6-ejb-examples.war'
}
