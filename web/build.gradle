plugins {
    id 'war'
}

apply from: rootProject.file('gradle/unit-tests.gradle')

dependencies {
    providedCompile rootProject.javaeeApi
    // The bean interfaces come from the EJB module, which sits next to the WAR in
    // the EAR, so they are compiled against but not copied into WEB-INF/lib.
    providedCompile project(':ejb')

    // Servlet 3.0 API with real classes for the tests (see gradle/unit-tests.gradle).
    testImplementation 'org.jboss.spec.javax.servlet:jboss-servlet-api_3.0_spec:1.0.2.Final'
    testImplementation testFixtures(project(':ejb'))   // InMemoryJndi
}

war {
    archiveFileName = 'jee6-ejb-examples-web.war'
    manifest {
        // Lets the web module load classes from the EJB jar in the same EAR.
        attributes 'Class-Path': 'jee6-ejb-examples-ejb.jar'
    }
}

// Exposes the WAR (not the plain classes jar) to the ear project.
configurations {
    warFile {
        canBeConsumed = true
        canBeResolved = false
    }
}
artifacts {
    warFile tasks.named('war')
}
