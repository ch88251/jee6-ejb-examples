# SLF4J (slf4j-simple) settings for Redisson's logging inside the web application.
org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.showDateTime=true

# RedissonRemoteService logs every exception a published service method throws
# at ERROR, with a stack trace, including ordinary checked exceptions such as
# ItemNotFoundException. The exception is still sent back to the remote caller,
# which handles it, so these entries are noise. EJB containers don't log
# application exceptions either. Remove this line to see them again.
org.slf4j.simpleLogger.log.org.redisson.RedissonRemoteService=off
