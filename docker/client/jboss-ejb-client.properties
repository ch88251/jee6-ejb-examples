# Remote EJB connection for the clients in the "client" Compose service
# (see docker/compose.yaml). "eap" is the server container's host name on the
# Compose network; use localhost to run the clients from the host instead.
endpoint.name=jee6-ejb-examples-client
remote.connectionprovider.create.options.org.xnio.Options.SSL_ENABLED=false

remote.connections=default
remote.connection.default.host=eap
remote.connection.default.port=4447
remote.connection.default.connect.options.org.xnio.Options.SASL_POLICY_NOANONYMOUS=false
remote.connection.default.connect.options.org.xnio.Options.SASL_DISALLOWED_MECHANISMS=JBOSS-LOCAL-USER

# The application user created in the Dockerfile (development only)
remote.connection.default.username=ejbuser
remote.connection.default.password=EjbUser#2026
