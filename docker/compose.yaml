# Redis + Tomcat running jee6-ejb-examples. Usually driven through Gradle, which
# calls docker/app.sh:
#   ./gradlew appUp        build the WAR, start Redis and Tomcat, deploy, wait
#   ./gradlew appDeploy    rebuild and redeploy the WAR into the running Tomcat
#   ./gradlew appClients   run both remote clients against them
#   ./gradlew appDown      stop and remove the containers and the Redis data
name: jee6-ejb-examples

services:
  redis:
    image: redis:7.4-alpine
    # Append-only file, so products and carts survive a container restart.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"   # for the remote clients and redis-cli on the host
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  tomcat:
    image: tomcat:9.0-jdk21-temurin   # Servlet 4.0 (javax.servlet)
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_ADDRESS: redis://redis:6379
    ports:
      - "8080:8080"   # http://localhost:8080/jee6-ejb-examples/

volumes:
  redis-data:
