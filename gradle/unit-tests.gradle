// Shared unit test setup for the ejb and web modules:
//   apply from: rootProject.file('gradle/unit-tests.gradle')
//
// Tests can't use javax:javaee-api:6.0 (it has no method bodies), so the test
// classpath gets the real EJB 3.1, JMS 1.1 and JTA 1.1 API classes from the
// JBoss spec jars. They are test-only and never packaged.

configurations {
    // Mockito attached as a Java agent (instead of self-attaching at runtime,
    // which newer JDKs warn about).
    mockitoAgent
}

dependencies {
    testImplementation 'org.jboss.spec.javax.ejb:jboss-ejb-api_3.1_spec:1.0.2.Final'
    testImplementation 'org.jboss.spec.javax.jms:jboss-jms-api_1.1_spec:1.0.1.Final'
    testImplementation 'org.jboss.spec.javax.transaction:jboss-transaction-api_1.1_spec:1.0.1.Final'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.14.2'
    mockitoAgent('org.mockito:mockito-core:5.14.2') { transitive = false }
}

// Keep the signatures-only Java EE jar off the test classpath, in case it
// arrives through providedCompile (war plugin) or a project dependency.
['testCompileClasspath', 'testRuntimeClasspath'].each { name ->
    configurations.named(name) {
        exclude group: 'javax', module: 'javaee-api'
    }
}

// Production code targets Java 8 (the server). Tests only run on the build
// JDK, and Mockito 5 needs Java 11+.
tasks.named('compileTestJava') {
    options.release = 11
}

tasks.named('test') {
    useJUnitPlatform()
    def agent = configurations.mockitoAgent
    jvmArgumentProviders.add({ ["-javaagent:${agent.singleFile}"] } as CommandLineArgumentProvider)
    // Avoids the JVM's "Sharing is only supported for boot loader classes" warning
    // that a -javaagent triggers.
    jvmArgs '-Xshare:off'
    testLogging {
        events = ['failed', 'skipped']
        exceptionFormat = 'full'
    }
}

// ---- Code coverage (JaCoCo) ----
// ./gradlew test writes a per-module report to <module>/build/reports/jacoco/test/;
// ./gradlew coverage (root) also writes the combined report for all modules.
// ./gradlew check (and build) fails if a module's line coverage drops below
// defaultMinLineCoverage (root build.gradle); override with -PminLineCoverage=0.9
apply plugin: 'jacoco'

tasks.named('test') {
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport') {
    reports {
        html.required = true
        xml.required = true    // for CI tools and IDEs
        csv.required = false
    }
}

tasks.named('jacocoTestCoverageVerification') {
    // -PminLineCoverage=... on the command line wins over the root build's default.
    BigDecimal requiredRatio = providers.gradleProperty('minLineCoverage')
            .map { new BigDecimal(it) }
            .getOrElse(rootProject.ext.defaultMinLineCoverage as BigDecimal)
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = requiredRatio
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}
